name: PyPi Publisher

on:
  release:
    types: [published]

jobs:
  pypi-publisher:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pypsbuilder

    permissions:
      id-token: write # IMPORTANT: mandatory for trusted publishing
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Build package
        run: uv build

      - name: Publish distribution 📦 to PyPI
        run: uv publish
