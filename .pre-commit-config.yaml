default_stages: [commit, push]
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
    - id: ruff-check
      args: [--fix]
      exclude: ^(venv/|docs/)
      types: ['python']
    - id: ruff-format
      exclude: ^(venv/|docs/)
      types: ['python']
  - repo: local
    hooks:
    - id: pytest
      name: pytest
      entry: uv run pytest
      language: system
      types: [python]
      pass_filenames: false
      always_run: true
